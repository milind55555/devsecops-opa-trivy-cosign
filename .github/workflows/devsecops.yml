name: DevSecOps CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: devsecops-demo

jobs:
  test-and-sast:
    name: Unit tests and SonarQube SAST
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run unit tests
        working-directory: app
        run: npm test
      - name: SonarQube scan
        if: ${{ vars.SONAR_HOST_URL != '' && vars.SONAR_PROJECT_KEY != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.sources=app
            -Dsonar.tests=app
            -Dsonar.test.inclusions=**/*.test.js
      - name: Explain SonarQube configuration
        if: ${{ vars.SONAR_HOST_URL == '' || vars.SONAR_PROJECT_KEY == '' }}
        run: echo "SonarQube skipped. Configure SONAR_HOST_URL, SONAR_PROJECT_KEY and SONAR_TOKEN to enable SAST."

  scan-build-push-sign:
    name: Trivy scan, ECR publish and Cosign sign
    needs: test-and-sast
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.3

      - name: Trivy filesystem scan
        run: trivy fs --scanners vuln,misconfig,secret --severity CRITICAL --exit-code 1 .

      - name: Build image
        run: |
          docker build -t "${IMAGE_NAME}:${GITHUB_SHA}" .
          echo "LOCAL_IMAGE=${IMAGE_NAME}:${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Trivy container image scan
        run: trivy image --scanners vuln --severity CRITICAL --exit-code 1 "${LOCAL_IMAGE}"

      - name: Configure AWS credentials using GitHub OIDC
        if: github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name != 'pull_request'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        if: github.event_name != 'pull_request'
        run: |
          IMAGE_URI="${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}"
          docker tag "${LOCAL_IMAGE}" "${IMAGE_URI}:${GITHUB_SHA}"
          aws ecr describe-repositories --repository-names "${{ vars.ECR_REPOSITORY }}" >/dev/null
          docker push "${IMAGE_URI}:${GITHUB_SHA}"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Resolve immutable image digest
        if: github.event_name != 'pull_request'
        id: digest
        run: |
          DIGEST="$(aws ecr describe-images \
            --repository-name "${{ vars.ECR_REPOSITORY }}" \
            --image-ids imageTag="${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' --output text)"
          test -n "$DIGEST" && test "$DIGEST" != "None"
          echo "image=${IMAGE_URI}@${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign image using keyless OIDC
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: cosign sign --yes "${{ steps.digest.outputs.image }}"

      - name: Verify image signature
        if: github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${{ steps.digest.outputs.image }}"

      - name: Publish image reference for deployment
        if: github.event_name != 'pull_request'
        run: echo "Signed image: ${{ steps.digest.outputs.image }}" >> "$GITHUB_STEP_SUMMARY"
